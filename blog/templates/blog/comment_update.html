{% extends 'base.html' %}
{% block title %}Редактирование комментария{% endblock %}
{% block header %}<h3 class="mb-3">Редактирование комментария</h3>{% endblock %}
{% block content %}
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{{ url_for('blog.index') }}#post-id-{{ comment.post.id }}">Лента</a></li>
        <li class="breadcrumb-item"><a href="{{ url_for('blog.view', post_id=comment.post.id) }}#comments">Комментарии поста</a></li>
        <li class="breadcrumb-item active" aria-current="page">Редактирование комментария</li>
    </ol>
</nav>
<form method="post">
    <textarea class="form-control mb-3" name="body" data-mde="comment" placeholder="Текст комментария...">{{ comment.body }}</textarea>
    <div class="d-flex align-items-center justify-content-end">
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a class="btn btn-secondary ms-2" href="{{ url_for('blog.view', post_id=comment.post_id) }}#comments">Отмена</a>
    </div>
</form>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde@2.21.0/dist/easymde.min.css">
<script src="https://cdn.jsdelivr.net/npm/easymde@2.21.0/dist/easymde.min.js"></script>
<script src="{{ url_for('static', filename='emoji_list.js') }}"></script>
<script src="{{ url_for('static', filename='emoji_picker.js') }}"></script>
<script src="{{ url_for('static', filename='md_editor_init.js') }}"></script>
{% endblock %}

{% extends 'base.html' %}
{% block title %}Новый пост{% endblock %}
{% block header %}<h3>Новый пост</h3>{% endblock %}
{% block content %}
<div class="card mx-auto">
    <div class="card-body">
        <form method="post">
            <div class="mb-3">
                <label class="form-label" for="title">Заголовок</label>
                <input class="form-control" id="title" name="title" value="{{ request.form['title'] }}" required>
            </div>
            <div class="mb-2">
                <label class="form-label" for="body">Тело поста</label>
                <textarea class="form-control" id="body" name="body" rows="8">{{ request.form['body'] }}</textarea>
            </div>
            {% include 'blog/_cheatsheet.html' %}
            <button class="btn btn-primary" type="submit">Сохранить</button>
            <a class="btn btn-secondary" href="{{ url_for('blog.index') }}">Отмена</a>
        </form>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde@2.21.0/dist/easymde.min.css">
        <script src="https://cdn.jsdelivr.net/npm/easymde@2.21.0/dist/easymde.min.js"></script>
        <script src="{{ url_for('static', filename='emoji_list.js') }}"></script>
        <script src="{{ url_for('static', filename='emoji_picker.js') }}"></script>
        <script src="{{ url_for('static', filename='md_editor_init.js') }}"></script>
    </div>
</div>
{% endblock %}

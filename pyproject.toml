[project]
name = "blog"
version = "1.0.0"
description = ""
requires-python = ">=3.15"
dependencies = [
    "Flask==3.1.3",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-Login==0.6.3",
    "Markdown==3.11.2",
    "Flask-JWT-Extended==4.7.4",
    "Flask-Migrate==4.1.0",
    "nh3==0.3.7",
    "mistune==3.4.0",
    "Pillow==13.0.0",
]

[build-system]
requires = ["flit_core<4"]
build-backend = "flit_core.buildapi"

[project.optional-dependencies]
dev = [
    "ruff==0.17.2",
]
test = [
    "coverage==7.16.2",
    "pytest==9.1.1",
    "Faker==40.44.0",
    "allure-pytest==2.16.2",
    "pytest-glamor-allure==1.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:faker -v --alluredir=allure-results --clean-alluredir"

[tool.coverage.run]
branch = true
source = ["blog"]

[tool.ruff]
line-length = 120
target-version = "py315"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes (неиспользуемые импорты, undefined names)
    "I",    # isort — сортировка импортов
    "UP",   # pyupgrade — современный синтаксис
    "B",    # bugbear — реальные баги
    "Q",    # кавычки
    "D",    # докстринги (pydocstyle)
]

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-decorators = ["wraps"]
